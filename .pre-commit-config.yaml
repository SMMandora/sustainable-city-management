repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: check-yaml
      - id: check-toml

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      - id: ruff
        args: [--fix]
        files: ^services/backend/
      - id: ruff-format
        files: ^services/backend/

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.13.0
    hooks:
      - id: mypy
        files: ^services/backend/(apps|config)/
        args: [--config-file=services/backend/pyproject.toml]
        additional_dependencies:
          - django>=5.1,<5.2
          - django-stubs[compatible-mypy]>=5.1,<6
          - djangorestframework-stubs[compatible-mypy]>=3.15,<4
          - pydantic>=2.9,<3
          - django-environ>=0.11,<0.12

  - repo: https://github.com/PyCQA/bandit
    rev: 1.8.0
    hooks:
      - id: bandit
        args: [-c, services/backend/pyproject.toml, -r]
        files: ^services/backend/apps/
        additional_dependencies: ["bandit[toml]"]
