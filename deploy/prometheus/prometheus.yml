global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alerts.yml"

scrape_configs:
  - job_name: web
    metrics_path: /metrics
    static_configs:
      - targets: ["web:8000"]
        labels:
          service: web

  - job_name: celery-exporter
    metrics_path: /metrics
    static_configs:
      - targets: ["celery-exporter:9808"]
        labels:
          service: celery
