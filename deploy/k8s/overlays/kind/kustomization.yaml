apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

# kind clusters use the local image cache. `kind load docker-image` puts
# scm-backend:dev and scm-frontend:dev into every node — no registry needed.
images:
  - name: scm-backend
    newTag: dev
  - name: scm-frontend
    newTag: dev
