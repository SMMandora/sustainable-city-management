# Real secret is NOT committed. Create it once on the cluster with:
#   kubectl create secret generic scm-secrets -n scm \
#     --from-literal=django-secret-key='<random>' \
#     --from-literal=postgres-password='postgres' \
#     --from-literal=openweather-api-key='<your-key>' \
#     --from-literal=sonitus-username='' \
#     --from-literal=sonitus-password=''
apiVersion: v1
kind: Secret
metadata:
  name: scm-secrets
  namespace: scm
type: Opaque
stringData:
  django-secret-key: change-me
  postgres-password: postgres
  openweather-api-key: ""
  sonitus-username: ""
  sonitus-password: ""
