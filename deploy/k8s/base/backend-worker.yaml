apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: scm
spec:
  replicas: 2
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
        - name: worker
          image: scm-backend:dev
          imagePullPolicy: IfNotPresent
          command: ["celery", "-A", "config", "worker", "-l", "info", "--concurrency=4"]
          envFrom:
            - configMapRef:
                name: scm-config
          env:
            - name: DJANGO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: scm-secrets
                  key: django-secret-key
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: scm-secrets
                  key: postgres-password
            - name: OPENWEATHER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: scm-secrets
                  key: openweather-api-key
            - name: SONITUS_USERNAME
              valueFrom:
                secretKeyRef:
                  name: scm-secrets
                  key: sonitus-username
            - name: SONITUS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: scm-secrets
                  key: sonitus-password
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
