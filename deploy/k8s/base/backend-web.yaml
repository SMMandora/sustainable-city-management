apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: scm
  labels:
    app: web
spec:
  selector:
    app: web
  ports:
    - port: 8000
      targetPort: 8000
      name: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: scm
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: scm-backend:dev
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              python manage.py migrate --noinput &&
              python manage.py loaddata apps/observations/fixtures/initial_sources.json || true &&
              gunicorn config.asgi:application \
                -k uvicorn.workers.UvicornWorker \
                -w 2 -b 0.0.0.0:8000 \
                --access-logfile - --error-logfile -
          envFrom:
            - configMapRef:
                name: scm-config
          env:
            - name: DJANGO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: scm-secrets
                  key: django-secret-key
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: scm-secrets
                  key: postgres-password
            - name: OPENWEATHER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: scm-secrets
                  key: openweather-api-key
            - name: SONITUS_USERNAME
              valueFrom:
                secretKeyRef:
                  name: scm-secrets
                  key: sonitus-username
            - name: SONITUS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: scm-secrets
                  key: sonitus-password
          ports:
            - containerPort: 8000
              name: http
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
